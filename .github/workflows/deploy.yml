name: Frontend CI/CD

on:
  push:
    branches: [ "deploy" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    - name: Build and push
      run: |
        docker build -t nicolasmaker/innovatech-frontend:latest .
        docker push nicolasmaker/innovatech-frontend:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.FRONTEND_IP }}
        username: ec2-user
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          sudo yum install -y docker
          sudo systemctl start docker
          sudo usermod -aG docker ec2-user
          sudo docker pull nicolasmaker/innovatech-frontend:latest
          sudo docker stop frontend || true
          sudo docker rm frontend || true
          sudo docker run -d --name frontend -p 80:80 nicolasmaker/innovatech-frontend:latest

